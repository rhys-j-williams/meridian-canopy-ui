<mat-tab-group class="cn-tabs__group" [selectedIndex]="selectedIndex" [mat-stretch-tabs]="false" animationDuration="150ms"
               disableRipple [attr.aria-label]="ariaLabel" (selectedTabChange)="onChange($event)">
  <mat-tab *ngFor="let tab of tabs" [disabled]="tab.disabled" labelClass="cn-tabs__tab">
    <ng-template mat-tab-label>
      <span class="cn-tabs__label">
        <mat-icon *ngIf="tab.icon" class="cn-tabs__icon" [svgIcon]="tab.icon" aria-hidden="true"></mat-icon>
        <span>{{ tab.label }}</span>
        <span class="cn-tabs__badge" *ngIf="tab.badge !== null && tab.badge !== 0">{{ tab.badge }}</span>
      </span>
    </ng-template>
    <ng-template matTabContent>
      <div class="cn-tabs__body">
        <ng-container *ngTemplateOutlet="tab.template"></ng-container>
      </div>
    </ng-template>
  </mat-tab>
</mat-tab-group>
