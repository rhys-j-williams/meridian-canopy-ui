<mat-nav-list *ngIf="interactive; else plain" class="cn-list__list" [attr.aria-label]="ariaLabel">
  <ng-container *ngFor="let item of items; let last = last; trackBy: trackById">
    <a mat-list-item class="cn-list__item" href="#" [disabled]="item.disabled" [attr.aria-disabled]="item.disabled || null"
       (click)="$event.preventDefault(); select(item)">
      <mat-icon *ngIf="item.icon" matListItemIcon class="cn-list__icon" [svgIcon]="isSvgIcon(item.icon) ? item.icon : ''" aria-hidden="true">{{ isSvgIcon(item.icon) ? '' : item.icon }}</mat-icon>
      <span matListItemTitle class="cn-list__text">
        <span class="cn-list__primary">{{ item.primary }}</span><span class="cn-list__secondary" *ngIf="item.secondary">{{ item.secondary }}</span>
      </span>
      <span matListItemMeta class="cn-list__meta" *ngIf="item.meta || metaTemplate">
        <ng-container *ngIf="metaTemplate; else metaText" [ngTemplateOutlet]="metaTemplate" [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
        <ng-template #metaText>{{ item.meta }}</ng-template>
      </span>
    </a>
    <mat-divider *ngIf="dividers && !last"></mat-divider>
  </ng-container>
  <p class="cn-list__empty" *ngIf="!items.length">{{ emptyText }}</p>
</mat-nav-list>
<ng-template #plain>
  <mat-list class="cn-list__list" [attr.aria-label]="ariaLabel">
    <ng-container *ngFor="let item of items; let last = last; trackBy: trackById">
      <mat-list-item class="cn-list__item">
        <mat-icon *ngIf="item.icon" matListItemIcon class="cn-list__icon" [svgIcon]="isSvgIcon(item.icon) ? item.icon : ''" aria-hidden="true">{{ isSvgIcon(item.icon) ? '' : item.icon }}</mat-icon>
        <span matListItemTitle class="cn-list__text">
          <span class="cn-list__primary">{{ item.primary }}</span><span class="cn-list__secondary" *ngIf="item.secondary">{{ item.secondary }}</span>
        </span>
        <span matListItemMeta class="cn-list__meta" *ngIf="item.meta || metaTemplate">
          <ng-container *ngIf="metaTemplate; else metaPlainText" [ngTemplateOutlet]="metaTemplate" [ngTemplateOutletContext]="{ $implicit: item }"></ng-container>
          <ng-template #metaPlainText>{{ item.meta }}</ng-template>
        </span>
      </mat-list-item>
      <mat-divider *ngIf="dividers && !last"></mat-divider>
    </ng-container>
    <p class="cn-list__empty" *ngIf="!items.length">{{ emptyText }}</p>
  </mat-list>
</ng-template>
