<ng-template #content>
  <mat-spinner *ngIf="loading" class="cn-button__spinner" diameter="18" strokeWidth="2" aria-hidden="true"></mat-spinner>
  <span class="cn-button__label"><ng-content></ng-content></span>
</ng-template>

<!-- Icons are projected into the MDC button's leading / trailing slots (mat-icon / [iconPositionEnd]);
     the spinner and label share the MDC label slot. -->
<button *ngIf="isFlat" mat-flat-button class="cn-button__native" [color]="color" [type]="type" [disabled]="disabled || loading"
        [attr.aria-label]="ariaLabel" [attr.aria-busy]="loading || null" (click)="onClick($event)">
  <mat-icon *ngIf="icon && !loading && iconPosition === 'start'" class="cn-button__icon cn-button__icon--start"
            [svgIcon]="isSvgIcon ? icon : ''" aria-hidden="true">{{ isSvgIcon ? '' : icon }}</mat-icon>
  <ng-container *ngTemplateOutlet="content"></ng-container>
  <mat-icon *ngIf="icon && !loading && iconPosition === 'end'" iconPositionEnd class="cn-button__icon cn-button__icon--end"
            [svgIcon]="isSvgIcon ? icon : ''" aria-hidden="true">{{ isSvgIcon ? '' : icon }}</mat-icon>
</button>
<button *ngIf="isStroked" mat-stroked-button class="cn-button__native" color="primary" [type]="type" [disabled]="disabled || loading"
        [attr.aria-label]="ariaLabel" [attr.aria-busy]="loading || null" (click)="onClick($event)">
  <mat-icon *ngIf="icon && !loading && iconPosition === 'start'" class="cn-button__icon cn-button__icon--start"
            [svgIcon]="isSvgIcon ? icon : ''" aria-hidden="true">{{ isSvgIcon ? '' : icon }}</mat-icon>
  <ng-container *ngTemplateOutlet="content"></ng-container>
  <mat-icon *ngIf="icon && !loading && iconPosition === 'end'" iconPositionEnd class="cn-button__icon cn-button__icon--end"
            [svgIcon]="isSvgIcon ? icon : ''" aria-hidden="true">{{ isSvgIcon ? '' : icon }}</mat-icon>
</button>
<button *ngIf="!isFlat && !isStroked" mat-button class="cn-button__native" color="primary" [type]="type" [disabled]="disabled || loading"
        [attr.aria-label]="ariaLabel" [attr.aria-busy]="loading || null" (click)="onClick($event)">
  <mat-icon *ngIf="icon && !loading && iconPosition === 'start'" class="cn-button__icon cn-button__icon--start"
            [svgIcon]="isSvgIcon ? icon : ''" aria-hidden="true">{{ isSvgIcon ? '' : icon }}</mat-icon>
  <ng-container *ngTemplateOutlet="content"></ng-container>
  <mat-icon *ngIf="icon && !loading && iconPosition === 'end'" iconPositionEnd class="cn-button__icon cn-button__icon--end"
            [svgIcon]="isSvgIcon ? icon : ''" aria-hidden="true">{{ isSvgIcon ? '' : icon }}</mat-icon>
</button>
