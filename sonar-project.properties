# Consumed by the mock sonar-scanner in platform-tooling/mock-scanners/bin.
sonar.projectKey=northgate:canopy-ui
sonar.projectName=Canopy design system
sonar.projectVersion=4.0.0
sonar.sources=projects/canopy-ui/src,projects/canopy-ui/schematics,projects/canopy-showcase/src
sonar.tests=projects
sonar.host.url=https://sonar.northgate.internal
sonar.login=CHANGEME-sonar-token-from-vault
sonar.qualitygate.wait=true
sonar.javascript.lcov.reportPaths=coverage/canopy-ui/lcov.info
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/target/**,**/*.spec.ts,**/*.mock.ts,projects/canopy-ui/schematics/ng-update/**/*.js,projects/canopy-ui/schematics/ng-update/**/*.d.ts,projects/canopy-ui/schematics/**/*.spec.js
sonar.test.inclusions=**/*.spec.ts
sonar.typescript.tsconfigPaths=tsconfig.json,projects/canopy-ui/tsconfig.lib.json
# Generated by the schematics build (ng-update/*.js, *.d.ts); excluded above or Sonar counts the compiled output twice.
sonar.coverage.exclusions=**/schematics/**,projects/canopy-showcase/**
